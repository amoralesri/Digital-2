[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ws2812-studio"
version = "0.1.0"
description = "Desktop editor for the LiteX WS2812 8x8 matrix project."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pyserial>=3.5",
    "Pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ws2812_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
